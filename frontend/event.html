<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details – UMBC Food Radar</title>
  <script>
    (function() {
      const p = new URLSearchParams(window.location.search);
      const id = p.get('id');
      if (id) {
        window.location.replace('/?open=' + encodeURIComponent(id));
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;padding:2rem;">Redirecting to event details...</p>
</body>
</html>
