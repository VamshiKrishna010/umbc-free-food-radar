<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FDB515">
  <meta name="description" content="Important dates, free food & campus events at UMBC. One place for Registrar, myUMBC, SEB, SBS & more.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Food Radar">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>UMBC Food Radar - Important Dates, Free Food & Campus Events</title>

  <!-- Typography: Google Fonts fallback & Local Archivo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5">

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <!-- Sticky Header -->
  <header class="app-header">
    <div class="wrap">
      <a class="brand" id="brandHome" aria-label="UMBC Food Radar home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#FDB515"/>
          <circle cx="16" cy="16" r="10" fill="none" stroke="#1A1500" stroke-width="2"/>
          <circle cx="16" cy="16" r="5" fill="none" stroke="#1A1500" stroke-width="2"/>
          <path d="M16 16 L16 6 A10 10 0 0 1 24.7 11 Z" fill="#1A1500"/>
          <circle cx="21.5" cy="19.5" r="1.8" fill="#1A1500"/>
        </svg>
        <span class="brand-name">Food Radar<small>UMBC</small></span>
      </a>

      <!-- Primary Navigation (Desktop) -->
      <nav class="primary-nav desktop-only" id="primaryNav" aria-label="Sections"></nav>

      <!-- Tools: Freshness, Search, Theme -->
      <div class="header-tools">
        <span class="freshness desktop-only" id="freshnessWrapper">
          <span class="dot pulse"></span>
          <span id="freshness">Checking campus...</span>
        </span>

        <label class="search desktop-only" id="desktopSearchLabel">
          <svg class="icon icon-sm"><use href="#i-search"/></svg>
          <span class="sr-only">Search</span>
          <input type="search" id="searchInput" placeholder="Search food, events, rooms..." autocomplete="off">
          <span class="kbd">/</span>
        </label>

        <button class="icon-btn mobile-only" id="mobileSearchBtn" aria-label="Toggle Search">
          <svg class="icon"><use href="#i-search"/></svg>
        </button>

        <button class="icon-btn" id="themeBtn" aria-label="Switch theme">
          <svg class="icon"><use href="#i-moon"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Collapsible Search Input -->
  <div class="mobile-search-bar" id="mobileSearchBar" hidden>
    <div class="mobile-search-inner">
      <svg class="icon icon-sm" aria-hidden="true"><use href="#i-search"/></svg>
      <input type="search" id="mobileSearchInput" placeholder="Search food, events, rooms..." autocomplete="off" autocapitalize="none">
      <button class="icon-btn mobile-clear-btn" id="clearMobileSearchBtn" aria-label="Clear search text" style="display:none">
        <svg class="icon icon-sm"><use href="#i-x"/></svg>
      </button>
    </div>
    <button class="icon-btn" id="closeMobileSearchBtn" aria-label="Close search">
      <svg class="icon"><use href="#i-x"/></svg>
    </button>
  </div>

  <!-- Main Dynamic Application Container -->
  <div id="app">
    <!-- Rendered dynamically by script.js -->
  </div>

  <!-- Bottom Navigation (Mobile) -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Sections"></nav>

  <!-- SVG Icon Sprite (Lucide-Style) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.6-4.6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4M12 2v13"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></symbol>
    <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2M13 17v2M13 11v2"/></symbol>
    <symbol id="i-alarm" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3 2 6M22 6l-3-3"/></symbol>
    <symbol id="i-chev-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chev-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4ZM3 6h18M16 10a4 4 0 0 1-8 0"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></symbol>
    <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M12 20h.01M8.5 16.4a5 5 0 0 1 7 0M2 8.8a15 15 0 0 1 4.2-2.6M10.7 5c4-.4 8.1.9 11.3 3.8M16.9 11.3a10 10 0 0 1 2.2 1.7M5 13a10 10 0 0 1 5.2-2.8M2 2l20 20"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
  </svg>

  <script src="script.js?v=5"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
