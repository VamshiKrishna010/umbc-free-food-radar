<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fdb515">
    <title>Event Details – UMBC Food Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="event.css">
</head>

<body>
    <div class="app-background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>

        <div class="event-detail-container">
            <!-- Back Navigation -->
            <a href="index.html" class="back-btn" id="backBtn">
                <span class="back-arrow">←</span>
                <span>Back to events</span>
            </a>

            <!-- Loading State -->
            <div id="detail-loading" class="detail-loading">
                <div class="skeleton-card detail-skeleton">
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line long" style="height:2.5rem; margin:1rem 0;"></div>
                    <div class="skeleton-line medium"></div>
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line medium"></div>
                </div>
            </div>

            <!-- Event Detail Content -->
            <article id="detail-content" class="detail-content" style="display:none">

                <div class="detail-meta-row">
                    <span id="detail-badge" class="detail-badge"></span>
                    <span id="detail-source" class="source-badge"></span>
                </div>

                <h1 id="detail-title" class="detail-title"></h1>

                <div class="detail-info-grid">
                    <div class="detail-info-item" id="detail-date-row">
                        <span class="detail-info-icon">📅</span>
                        <div>
                            <div class="detail-info-label">Date &amp; Time</div>
                            <div id="detail-date" class="detail-info-value"></div>
                        </div>
                    </div>
                    <div class="detail-info-item" id="detail-location-row" style="display:none">
                        <span class="detail-info-icon">📍</span>
                        <div>
                            <div class="detail-info-label">Location</div>
                            <div id="detail-location" class="detail-info-value"></div>
                        </div>
                    </div>
                </div>

                <div class="detail-description-section">
                    <h2 class="detail-section-title">About this event</h2>
                    <p id="detail-description" class="detail-description"></p>
                </div>

                <div class="detail-actions">
                    <a id="detail-external-link" href="#" target="_blank" rel="noopener"
                        class="detail-action-btn primary">
                        View original ↗
                    </a>
                    <button id="detail-fav-btn" class="detail-action-btn secondary fav-btn"
                        title="Add to favorites">❤</button>
                    <button id="detail-cal-btn" class="detail-action-btn secondary" title="Add to calendar">+
                        Calendar</button>
                    <button id="detail-share-btn" class="detail-action-btn secondary" title="Share">Share</button>
                </div>

            </article>

            <!-- Error State -->
            <div id="detail-error" class="detail-error" style="display:none">
                <p>⚠️ Could not load event details.</p>
                <a href="index.html" class="detail-action-btn primary" style="margin-top:1rem; display:inline-block;">←
                    Back to events</a>
            </div>
        </div>
    </div>

    <script src="event.js?v=20260303"></script>
</body>

</html>
