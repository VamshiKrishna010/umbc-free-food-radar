<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMBC Food Radar - Important Dates, Free Food & Campus Events</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    
    <div class="app-background">
        <!-- Abstract glowing orbs behind the content -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        
        <div class="container">
            <header>
                <h1>UMBC <span class="highlight">Food Radar</span></h1>
                <p class="subtitle">Important dates, free food, campus events — from Registrar, myUMBC, SEB, SBS, Campus Life &amp; more.</p>
            </header>

            <nav class="tabs">
                <button class="tab-btn active" data-tab="important_date">Important Dates</button>
                <button class="tab-btn" data-tab="food_event">Free Food</button>
                <button class="tab-btn" data-tab="campus_event">Campus Events</button>
            </nav>

            <main>
                <div class="controls">
                    <div class="search-bar">
                        <input type="text" id="searchInput" placeholder="Search events..." />
                        <span class="search-icon">🔍</span>
                    </div>
                </div>

                <div id="events-grid" class="events-grid">
                    <!-- Events will be rendered here dynamically -->
                    <div class="loading">Scanning campus for free food...</div>
                </div>
            </main>
            
            <footer>
                <p>Data from Registrar, myUMBC, SEB, SBS, Campus Life, Tickets, Retriever Essentials. Updates every 2 hours.</p>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
